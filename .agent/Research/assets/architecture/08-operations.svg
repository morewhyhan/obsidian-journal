troke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="370,788 410,788" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="700,788 740,788" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="1030,788 1070,788" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><g data-card="c1"><rect x="80" y="183" width="220" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 184.5 H 282" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c2"><rect x="345" y="183" width="220" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 363 184.5 H 547" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c3"><rect x="610" y="183" width="220" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 628 184.5 H 812" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c4"><rect x="875" y="183" width="220" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 893 184.5 H 1077" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c5"><rect x="1140" y="183" width="220" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1158 184.5 H 1342" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c6"><rect x="80" y="396" width="400" height="214" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 397.5 H 462" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c7"><rect x="520" y="396" width="400" height="214" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 538 397.5 H 902" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/></g><g data-card="c8"><rect x="960" y="396" width="400" height="214" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 978 397.5 H 1342" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c9"><rect x="80" y="730" width="290" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 731.5 H 352" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c10"><rect x="410" y="730" width="290" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 428 731.5 H 682" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c11"><rect x="740" y="730" width="290" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 758 731.5 H 1012" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c12"><rect x="1070" y="730" width="290" height="116" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1088 731.5 H 1342" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">运维架构｜能观察、能止损、能恢复</text><text x="80" y="121" font-size="22" fill="#61738B">回答：故障如何被发现，怎样接续，何时恢复主动能力。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="102" y="222" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="176">启动检查</text><text x="102" y="257" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="176">配置 / 秘密 / 锁</text><text x="367" y="222" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="176">恢复旧提交</text><text x="367" y="257" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="176">先取得一致基线</text><text x="632" y="222" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="176">迁移与核对</text><text x="632" y="257" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="176">兼容 / 数据版本</text><text x="897" y="222" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="176">就绪或降级</text><text x="897" y="257" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="176">按可用能力开放</text><text x="1162" y="222" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="176">排空 / 维护</text><text x="1162" y="257" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="176">停认领，保留在途</text><text x="102" y="435" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">看得见</text><text x="102" y="470" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">存活 / 本地就绪 / 依赖状态</text><text x="102" y="498" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">关联 ID / 队列年龄 / 阻止原因</text><text x="102" y="526" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">调用费用 / 资源与日志有上限</text><text x="102" y="554" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">不记录密钥或完整私人正文</text><text x="542" y="435" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">故障不扩散</text><text x="542" y="470" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">模型失败：保留可靠原文提醒</text><text x="542" y="498" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">QQ 离线：不补过期消息</text><text x="542" y="526" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">磁盘 / 半提交：停写并恢复</text><text x="542" y="554" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">结果 unknown：核对，不盲重发</text><text x="982" y="435" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">可恢复</text><text x="982" y="470" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">一致快照，独立密钥加密</text><text x="982" y="498" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">暂存校验后才发布备份</text><text x="982" y="526" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">恢复到空目录，再核对授权</text><text x="982" y="554" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">单机方案，不伪装主机高可用</text><text x="80" y="689" font-size="27" fill="#172B45" font-weight="700" text-anchor="start">事故闭环</text><text x="300" y="689" font-size="22" fill="#61738B" font-weight="400" text-anchor="start">明确影响范围，修根因，取得证据后再恢复能力。</text><text x="102" y="769" font-size="24" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="246">隔离影响</text><text x="102" y="804" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">停相关写入或主动联系</text><text x="432" y="769" font-size="24" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="246">核对与恢复</text><text x="432" y="804" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">保存现场 / 查真实结果</text><text x="762" y="769" font-size="24" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="246">回归与验证</text><text x="762" y="804" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">同类反例 / 兼容 / 恢复</text><text x="1092" y="769" font-size="24" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="246">明确解除</text><text x="1092" y="804" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">发布新版本或解除门禁</text><text x="106" y="949" font-size="24" fill="#7C4DCC" font-weight="700" text-anchor="start" data-fit-width="1220">恢复旧事实，不等于恢复当前授权</text><text x="106" y="981" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">旧备份可能缺少新的取消或撤权；恢复保护先关后台写与主动投递，核对当前范围后再放开。</text><text x="80" y="1060" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1270">RPO / RTO 是待验证目标；未配置异机备份时，不宣称具备整机灾备。</text><line x1="80" x2="1360" y1="1111" y2="1111" stroke="#DCE4EF"/><text x="80" y="1139" font-size="17" fill="#61738B">私人 AI 助理 · QQ 单用户 MVP · 设计不等于已实现或实测通过</text><text x="1360" y="1139" text-anchor="end" font-size="17" fill="#61738B">08-operations</text></svg>