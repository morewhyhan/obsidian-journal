<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">业务架构｜把交代接成持续协作</title><desc id="desc">回答：服务什么问题，用户与助理分别负责什么。。私人AI助理v2.2目标设计，图中Core内框是逻辑模块，不表示新增微服务。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#172B45"/></marker><marker id="a-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#172B45"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61738B"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#61738B"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A9B8CA"/></marker><marker id="a-line-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#A9B8CA"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#2563EB"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F72"/></marker><marker id="a-green-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#087F72"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C4DCC"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#7C4DCC"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B7791F"/></marker><marker id="a-orange-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#B7791F"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BD4B55"/></marker><marker id="a-red-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#BD4B55"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#748399"/></marker><marker id="a-gray-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#748399"/></marker></defs><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1040" fill="#F8FAFD"/><rect x="80" y="165" width="1280" height="100" rx="22" fill="#EDF4FF" stroke="#2563EB" stroke-opacity=".25"/><rect x="80" y="744" width="1280" height="92" rx="22" fill="#F4EFFF" stroke="#7C4DCC" stroke-opacity=".25"/><polyline points="480,402 520,402" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="920,402 960,402" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="1160,475 1160,545" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="960,617 920,617" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><polyline points="520,617 480,617" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><g data-card="c1"><rect x="80" y="330" width="400" height="145" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 331.5 H 462" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c2"><rect x="520" y="330" width="400" height="145" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 538 331.5 H 902" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c3"><rect x="960" y="330" width="400" height="145" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 978 331.5 H 1342" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/></g><g data-card="c4"><rect x="80" y="545" width="400" height="145" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 546.5 H 462" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c5"><rect x="520" y="545" width="400" height="145" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 538 546.5 H 902" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c6"><rect x="960" y="545" width="400" height="145" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 978 546.5 H 1342" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">业务架构｜把交代接成持续协作</text><text x="80" y="121" font-size="22" fill="#61738B">回答：服务什么问题，用户与助理分别负责什么。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="106" y="203" font-size="27" fill="#2563EB" font-weight="700" text-anchor="start" data-fit-width="1228">用户要做的事</text><text x="106" y="235" font-size="20" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1228">达到任务成果，或让约定的最低习惯行为发生。</text><text x="102" y="369" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">① 接住交代</text><text x="102" y="404" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">明确成果 / 最低行为 / 时机</text><text x="102" y="432" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">讨论保持待定，接受后才办</text><text x="542" y="369" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">② 准备行动</text><text x="542" y="404" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">查资料、找入口、给下一步</text><text x="542" y="432" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">检查可用时间、依赖与容量</text><text x="982" y="369" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">③ 处理变化</text><text x="982" y="404" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">区分未知、延误和受阻</text><text x="982" y="432" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">能处理的先办，必要取舍才问</text><text x="102" y="584" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">⑥ 接续或收尾</text><text x="102" y="619" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">保留下一步、等待或明确终态</text><text x="102" y="647" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">重启和离开后仍找得到</text><text x="542" y="584" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">⑤ 按事实更新</text><text x="542" y="619" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">任务达标与习惯发生分开</text><text x="542" y="647" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">安排 / 日记 / 后续责任一致</text><text x="982" y="584" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">④ 用户行动与反馈</text><text x="982" y="619" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">本人执行，或说明真实进展</text><text x="982" y="647" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">没回复只代表状态未知</text><text x="106" y="779" font-size="24" fill="#7C4DCC" font-weight="700" text-anchor="start" data-fit-width="1220">助理负责组织和推进；用户保留目标与承诺的决定权</text><text x="106" y="811" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">准备好了 ≠ 用户完成；消息投递 ≠ 用户已读；不靠惩罚、主观评分或无限催促维持运行。</text><text x="80" y="903" font-size="24" fill="#172B45" font-weight="700" text-anchor="start">交付结果</text><text x="245" y="903" font-size="25" fill="#087F72" font-weight="500" text-anchor="start" data-fit-width="1090">少重复交代 · 更容易启动 · 被打断后能接上 · 无需额外维护一套表</text><line x1="80" x2="1360" y1="991" y2="991" stroke="#DCE4EF"/><text x="80" y="1019" font-size="17" fill="#61738B">私人 AI 助理 · QQ 单用户 MVP · 设计不等于已实现或实测通过</text><text x="1360" y="1019" text-anchor="end" font-size="17" fill="#61738B">01-business</text></svg>