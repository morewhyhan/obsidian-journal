<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc"><title id="title">安全架构｜先核验，再执行，再复核</title><desc id="desc">回答：谁可以做什么，怎样防止模型越权和旧结果误执行。。私人AI助理v2.2目标设计，图中Core内框是逻辑模块，不表示新增微服务。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#172B45"/></marker><marker id="a-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#172B45"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61738B"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#61738B"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A9B8CA"/></marker><marker id="a-line-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#A9B8CA"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#2563EB"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F72"/></marker><marker id="a-green-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#087F72"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C4DCC"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#7C4DCC"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B7791F"/></marker><marker id="a-orange-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#B7791F"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BD4B55"/></marker><marker id="a-red-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#BD4B55"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#748399"/></marker><marker id="a-gray-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#748399"/></marker></defs><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1110" fill="#F8FAFD"/><rect x="80" y="169" width="1280" height="92" rx="22" fill="#F4EFFF" stroke="#7C4DCC" stroke-opacity=".25"/><rect x="80" y="583" width="1280" height="270" rx="22" fill="#EDF4FF" stroke="#2563EB" stroke-opacity=".25"/><rect x="80" y="915" width="1280" height="92" rx="22" fill="#F0F3F7" stroke="#748399" stroke-opacity=".25"/><polyline points="370,429 410,429" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="700,429 740,429" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="1030,429 1070,429" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="1215,506 1215,550 720,550 720,583" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><g data-card="c1"><rect x="80" y="352" width="290" height="154" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 353.5 H 352" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c2"><rect x="410" y="352" width="290" height="154" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 428 353.5 H 682" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c3"><rect x="740" y="352" width="290" height="154" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 758 353.5 H 1012" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/></g><g data-card="c4"><rect x="1070" y="352" width="290" height="154" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1088 353.5 H 1342" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c5"><rect x="110" y="689" width="375" height="122" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 128 690.5 H 467" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c6"><rect x="532" y="689" width="375" height="122" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 550 690.5 H 889" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c7"><rect x="954" y="689" width="375" height="122" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 972 690.5 H 1311" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">安全架构｜先核验，再执行，再复核</text><text x="80" y="121" font-size="22" fill="#61738B">回答：谁可以做什么，怎样防止模型越权和旧结果误执行。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="106" y="204" font-size="24" fill="#7C4DCC" font-weight="700" text-anchor="start" data-fit-width="1220">两种来源，两种权限：本人交代 / 有限后台委托</text><text x="106" y="236" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">笔记内容、模型输出和“读过对象”都不是批准；后台不能借用本人回合的完整能力。</text><text x="102" y="391" font-size="24" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="246">① 身份与来源</text><text x="102" y="426" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">本人 / 正确 bot / 私聊</text><text x="102" y="454" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">可信桥接与有效事件身份</text><text x="102" y="482" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">陌生来源不进入本人业务</text><text x="432" y="391" font-size="24" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="246">② 执行依据</text><text x="432" y="426" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">当前交代 / 原案决定</text><text x="432" y="454" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">有效规则 / 已接受委托</text><text x="432" y="482" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">模型不能自行签发授权</text><text x="762" y="391" font-size="24" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="246">③ 范围与新鲜度</text><text x="762" y="426" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">对象 / 路径 / 版本</text><text x="762" y="454" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">work / step / grant</text><text x="762" y="482" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">撤销、过期和旧结果失效</text><text x="1092" y="391" font-size="24" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="246">④ 业务与后果</text><text x="1092" y="426" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">验收 / 固定承诺 / 预算</text><text x="1092" y="454" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">联系控制 / 恢复保护</text><text x="1092" y="482" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="246">不能偷改目标和硬截止</text><text x="106" y="621" font-size="27" fill="#2563EB" font-weight="700" text-anchor="start" data-fit-width="1228">通过所有核验，才进入同一执行通路</text><text x="106" y="653" font-size="20" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1228">提交和发前都重新核验；模型只使用能力，Core 决定是否接受操作。</text><text x="132" y="728" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="331">根内文件访问</text><text x="132" y="763" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">规范路径 / 安全打开 / hash</text><text x="132" y="791" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">合法读写保留；越界与链接拒绝</text><text x="554" y="728" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="331">后台最小权限</text><text x="554" y="763" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">凭据绑定责任、步骤与范围</text><text x="554" y="791" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">旧委托不绕过暂停或恢复门禁</text><text x="976" y="728" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="331">秘密与网络隔离</text><text x="976" y="763" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">密钥库外，模型只见必要片段</text><text x="976" y="791" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">提供者白名单，日志不泄漏秘密</text><text x="106" y="950" font-size="24" fill="#748399" font-weight="700" text-anchor="start" data-fit-width="1220">闸门可以阻止后果，但不能证明 LLM 永远理解正确</text><text x="106" y="982" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">自然语义另用真实模型反例验证；宿主与合法入站桥必须可信，不能把“有隔离”表述成零风险。</text><line x1="80" x2="1360" y1="1061" y2="1061" stroke="#DCE4EF"/><text x="80" y="1089" font-size="17" fill="#61738B">私人 AI 助理 · QQ 单用户 MVP · 设计不等于已实现或实测通过</text><text x="1360" y="1089" text-anchor="end" font-size="17" fill="#61738B">07-security</text></svg>