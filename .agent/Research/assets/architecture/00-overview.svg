DCC" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-purple)" marker-start="url(#a-purple-s)"/><rect x="882.5" y="328" width="235" height="30" rx="7" fill="#F8FAFD"/><text x="1000" y="351" text-anchor="middle" font-size="19" fill="#7C4DCC">经 Core 模型代理</text><polyline points="485,680 532,680" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="907,680 954,680" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="720,439 720,515" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="785,515 785,439" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><polyline points="720,791 720,821 280,821 280,850" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><polyline points="720,821 720,850" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><polyline points="720,821 1160,821 1160,850" fill="none" stroke="#748399" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-gray)"/><g data-card="c1"><rect x="80" y="166" width="400" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 167.5 H 462" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c2"><rect x="520" y="166" width="400" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 538 167.5 H 902" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c3"><rect x="960" y="166" width="400" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 978 167.5 H 1342" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c4"><rect x="80" y="337" width="200" height="102" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 338.5 H 262" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c5"><rect x="330" y="337" width="220" height="102" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 348 338.5 H 532" stroke="#748399" stroke-width="3" stroke-linecap="round"/></g><g data-card="c6"><rect x="600" y="337" width="300" height="102" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 618 338.5 H 882" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c7"><rect x="1100" y="337" width="260" height="102" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1118 338.5 H 1342" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c8"><rect x="110" y="620" width="375" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 128 621.5 H 467" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c9"><rect x="532" y="620" width="375" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 550 621.5 H 889" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c10"><rect x="954" y="620" width="375" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 972 621.5 H 1311" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c11"><rect x="80" y="850" width="400" height="126" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 851.5 H 462" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c12"><rect x="520" y="850" width="400" height="126" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 538 851.5 H 902" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c13"><rect x="960" y="850" width="400" height="126" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 978 851.5 H 1342" stroke="#748399" stroke-width="3" stroke-linecap="round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">一件交代，持续有人跟进</text><text x="80" y="121" font-size="22" fill="#61738B">从用户问题，到助理能力，再到内部执行与长期接续。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="102" y="205" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">交代不丢</text><text x="102" y="240" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">任务与偏好存下来</text><text x="102" y="268" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">回来接着做，不从头解释</text><text x="542" y="205" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">更容易开始</text><text x="542" y="240" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">准备材料与具体下一步</text><text x="542" y="268" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">在约定时机提供提示</text><text x="982" y="205" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">变化能接住</text><text x="982" y="240" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">发现冲突，局部调整</text><text x="982" y="268" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">必须取舍时带建议来问</text><text x="102" y="376" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="156">你 · QQ</text><text x="102" y="411" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="156">交代 / 反馈</text><text x="352" y="376" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="176">NapCat</text><text x="352" y="411" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="176">QQ 登录与消息</text><text x="622" y="376" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">AstrBot + 项目插件</text><text x="622" y="411" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">自然对话与工具循环</text><text x="1122" y="376" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="216">DeepSeek Flash</text><text x="1122" y="411" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="216">理解、建议与表达</text><text x="106" y="553" font-size="27" fill="#2563EB" font-weight="700" text-anchor="start" data-fit-width="1228">Core｜唯一的业务执行内核</text><text x="106" y="585" font-size="20" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1228">两种入口：用户交代，以及已接受规则的到期 / 事实变化。</text><text x="132" y="659" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="331">相关事实与工作视图</text><text x="132" y="694" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">当前方案 / 材料 / 有效规则</text><text x="132" y="722" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">按需查证，明确当前所指</text><text x="554" y="659" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="331">核验并执行</text><text x="554" y="694" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">身份 / 依据 / 版本 / 预算</text><text x="554" y="722" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">统一提交，返回真实回执</text><text x="976" y="659" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="331">保存责任与下一步</text><text x="976" y="694" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">关联对象 / 步骤 / 完成条件</text><text x="976" y="722" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="331">准备、等待、交接或收尾</text><text x="814" y="481" font-size="19" fill="#61738B" font-weight="400" text-anchor="start">工具调用 / 实际结果</text><text x="106" y="1050" font-size="24" fill="#B7791F" font-weight="700" text-anchor="start" data-fit-width="1220">主动准备，与主动联系分开判断</text><text x="106" y="1082" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">获准的事先做；联系还要检查暂停、静默、时机与额度，再经 AstrBot → NapCat → QQ。</text><text x="102" y="889" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">Markdown｜正文真源</text><text x="102" y="924" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">日记、文章、模板、资料</text><text x="102" y="952" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">统一模板创建，保留人工正文</text><text x="542" y="889" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">JSON｜长期业务事实</text><text x="542" y="924" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">任务、习惯、规则、决定</text><text x="542" y="952" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">接续责任与每日行为记录</text><text x="982" y="889" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">SQLite｜最小运行状态</text><text x="982" y="924" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">入件、出件、去重、恢复</text><text x="982" y="952" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">有限清理，不复制笔记全文</text><text x="720" y="1150" font-size="26" fill="#172B45" font-weight="600" text-anchor="middle" data-fit-width="1240">交代 → 准备 → 执行 / 反馈 → 调整 → 继续推进</text><line x1="80" x2="1360" y1="1181" y2="1181" stroke="#DCE4EF"/><text x="80" y="1209" font-size="17" fill="#61738B">私人 AI 助理 · QQ 单用户 MVP · 设计不等于已实现或实测通过</text><text x="1360" y="1209" text-anchor="end" font-size="17" fill="#61738B">00-overview</text></svg>