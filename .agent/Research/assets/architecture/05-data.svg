<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc"><title id="title">数据架构｜正文、事实与运行状态各有归属</title><desc id="desc">回答：什么保存在哪里，怎样关联，什么可以重建。。私人AI助理v2.2目标设计，图中Core内框是逻辑模块，不表示新增微服务。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#172B45"/></marker><marker id="a-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#172B45"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61738B"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#61738B"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A9B8CA"/></marker><marker id="a-line-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#A9B8CA"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#2563EB"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F72"/></marker><marker id="a-green-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#087F72"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C4DCC"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#7C4DCC"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B7791F"/></marker><marker id="a-orange-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#B7791F"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BD4B55"/></marker><marker id="a-red-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#BD4B55"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#748399"/></marker><marker id="a-gray-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#748399"/></marker></defs><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1110" fill="#F8FAFD"/><rect x="80" y="169" width="1280" height="92" rx="22" fill="#ECF8F3" stroke="#087F72" stroke-opacity=".25"/><rect x="80" y="957" width="1280" height="92" rx="22" fill="#EDF4FF" stroke="#2563EB" stroke-opacity=".25"/><polyline points="600,562 600,520 380,520 380,481" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)" marker-start="url(#a-green-s)"/><rect x="281.5" y="494" width="197" height="30" rx="7" fill="#F8FAFD"/><text x="380" y="517" text-anchor="middle" font-size="19" fill="#087F72">读取 / 条目投影</text><polyline points="840,562 840,520 1060,520 1060,481" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)" marker-start="url(#a-green-s)"/><rect x="961.5" y="494" width="197" height="30" rx="7" fill="#F8FAFD"/><text x="1060" y="517" text-anchor="middle" font-size="19" fill="#087F72">读取 / 发布事实</text><polyline points="600,688 600,731 380,731 380,769" fill="none" stroke="#748399" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-gray)" marker-start="url(#a-gray-s)"/><rect x="281.5" y="705" width="197" height="30" rx="7" fill="#F8FAFD"/><text x="380" y="728" text-anchor="middle" font-size="19" fill="#748399">运行记录 / 恢复</text><polyline points="840,688 840,731 1060,731 1060,769" fill="none" stroke="#7C4DCC" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-purple)"/><rect x="1009" y="705" width="102" height="30" rx="7" fill="#F8FAFD"/><text x="1060" y="728" text-anchor="middle" font-size="19" fill="#7C4DCC">按需派生</text><g data-card="c1"><rect x="80" y="331" width="600" height="150" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 332.5 H 662" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c2"><rect x="760" y="331" width="600" height="150" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 778 332.5 H 1342" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c3"><rect x="480" y="562" width="480" height="126" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 498 563.5 H 942" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c4"><rect x="80" y="769" width="600" height="150" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 770.5 H 662" stroke="#748399" stroke-width="3" stroke-linecap="round"/></g><g data-card="c5"><rect x="760" y="769" width="600" height="150" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 778 770.5 H 1342" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">数据架构｜正文、事实与运行状态各有归属</text><text x="80" y="121" font-size="22" fill="#61738B">回答：什么保存在哪里，怎样关联，什么可以重建。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="106" y="204" font-size="24" fill="#087F72" font-weight="700" text-anchor="start" data-fit-width="1220">一个服务器工作副本；同一事实只保留一个权威位置</text><text x="106" y="236" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">正文不复制进 SQLite；长期责任不依赖即将清理的聊天记录；秘密留在仓库外。</text><text x="102" y="370" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="556">文件｜正文与附件真源</text><text x="102" y="405" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">Markdown 日记 / 文章 / 模板；Attachment</text><text x="102" y="433" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">长期文字事实：.agent/context/</text><text x="102" y="461" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">保留人工内容；只投影获准的受管条目</text><text x="782" y="370" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="556">JSON｜长期业务事实</text><text x="782" y="405" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">registry：任务、习惯、规则、方案、Work</text><text x="782" y="433" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">days：发生、进展、更正与当时定义</text><text x="782" y="461" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">保存稳定 ID、版本、来源与必要证据</text><text x="502" y="601" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="436">Core + Store｜唯一发布者</text><text x="502" y="636" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="436">校验 → prepared → 文件发布 → applied</text><text x="502" y="664" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="436">恢复屏障 / 引用核对 / 真实回执</text><text x="102" y="808" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="556">SQLite｜有界运行状态</text><text x="102" y="843" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">schema_meta / documents / inbox</text><text x="102" y="871" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">events / outbox：去重、作业、预留、恢复</text><text x="102" y="899" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">可清理；不建立笔记或 registry 全文副本</text><text x="782" y="808" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="556">派生视图｜可重建</text><text x="782" y="843" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">相关工作视图 / 引用索引 / 资格 / 风险</text><text x="782" y="871" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">按对象版本、规则版本与文件 hash 失效</text><text x="782" y="899" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="556">从正式事实重建，不成为第二份知识库</text><text x="106" y="992" font-size="24" fill="#2563EB" font-weight="700" text-anchor="start" data-fit-width="1220">关系靠 ID 和正式引用连接，不靠标题猜测</text><text x="106" y="1024" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">Plan / DiaryLink 指向任务或习惯；Work 引用事项、材料与决定；清理保护仍被活动责任使用的依据。</text><line x1="80" x2="1360" y1="1061" y2="1061" stroke="#DCE4EF"/><text x="80" y="1089" font-size="17" fill="#61738B">私人 AI 助理 · QQ 单用户 MVP · 设计不等于已实现或实测通过</text><text x="1360" y="1089" text-anchor="end" font-size="17" fill="#61738B">05-data</text></svg>