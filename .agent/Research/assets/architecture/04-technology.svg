y="621" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 728 622.5 H 992" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c12"><rect x="1030" y="621" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1048 622.5 H 1312" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c13"><rect x="390" y="769" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 408 770.5 H 672" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c14"><rect x="710" y="769" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 728 770.5 H 992" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c15"><rect x="1030" y="769" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1048 770.5 H 1312" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">技术架构｜用现有组件完成闭环</text><text x="80" y="121" font-size="22" fill="#61738B">回答：采用哪些技术，各层负责什么。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="105" y="206" font-size="19" fill="#7C4DCC" font-weight="700" text-anchor="start">01</text><text x="105" y="243" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="250">接入与集成</text><text x="412" y="216" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">NapCat</text><text x="412" y="251" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">QQ 登录</text><text x="412" y="279" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">OneBot 反向 WebSocket</text><text x="732" y="216" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">AstrBot + Python 插件</text><text x="732" y="251" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">消息接入 / 对话工具循环</text><text x="732" y="279" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">Core 工具桥与渠道适配</text><text x="1052" y="216" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">共享接口合同</text><text x="1052" y="251" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">TypeScript 源契约</text><text x="1052" y="279" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">生成 schema 与双端校验</text><text x="105" y="354" font-size="19" fill="#2563EB" font-weight="700" text-anchor="start">02</text><text x="105" y="391" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="250">模型与应用入口</text><text x="412" y="364" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">DeepSeek Flash</text><text x="412" y="399" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">理解、建议与自然表达</text><text x="412" y="427" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">thinking 开启 / low</text><text x="732" y="364" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">Core 模型代理</text><text x="732" y="399" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">统一凭据 / 调用预留</text><text x="732" y="427" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">限时、费用与结构校验</text><text x="1052" y="364" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">Node.js 24 + Fastify</text><text x="1052" y="399" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">认证接口 / 应用用例</text><text x="1052" y="427" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">状态诊断与生命周期</text><text x="105" y="502" font-size="19" fill="#2563EB" font-weight="700" text-anchor="start">03</text><text x="105" y="539" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="250">应用协调</text><text x="412" y="512" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">交代与接续</text><text x="412" y="547" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">当前方案 / 批量决定</text><text x="412" y="575" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">版本、依据与稳定意图</text><text x="732" y="512" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">主动准备与调度</text><text x="732" y="547" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">事实唤醒 / 到期检查</text><text x="732" y="575" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">有界作业与独立派发</text><text x="1052" y="512" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">日记与材料</text><text x="1052" y="547" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">统一模板 / 层级索引</text><text x="1052" y="575" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">正文投影 / 文件工具</text><text x="105" y="650" font-size="19" fill="#087F72" font-weight="700" text-anchor="start">04</text><text x="105" y="687" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="250">领域规则</text><text x="412" y="660" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">任务 / 习惯 / Work</text><text x="412" y="695" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">纯状态转换与完成检查</text><text x="412" y="723" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">用户结果与助理步骤分开</text><text x="732" y="660" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">Planning / Policy</text><text x="732" y="695" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">容量、依赖与局部重排</text><text x="732" y="723" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">规则、例外与能力范围</text><text x="1052" y="660" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">日记 / 沟通规则</text><text x="1052" y="695" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">条目绑定与周期规则</text><text x="1052" y="723" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">联系门禁与投递状态</text><text x="105" y="798" font-size="19" fill="#087F72" font-weight="700" text-anchor="start">05</text><text x="105" y="835" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="250">持久化与恢复</text><text x="412" y="808" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">Markdown + JSON</text><text x="412" y="843" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">正文唯一真源</text><text x="412" y="871" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">长期事实与每日记录</text><text x="732" y="808" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">SQLite / better-sqlite3</text><text x="732" y="843" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">WAL + FULL / 五表</text><text x="732" y="871" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">最小运行状态与预留</text><text x="1052" y="808" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="256">Store / 文件协议</text><text x="1052" y="843" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">单写入 / hash / prepared</text><text x="1052" y="871" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="256">文件同步、恢复与幂等</text><text x="106" y="968" font-size="24" fill="#748399" font-weight="700" text-anchor="start" data-fit-width="1220">基础设施：单台 Linux + Docker Compose + 独立数据 / 秘密卷</text><text x="106" y="1000" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">不为 MVP 引入 Redis、MQ、Kubernetes、向量库或新的编排平台；已有 Web 兼容不在本轮扩展。</text><line x1="80" x2="1360" y1="1041" y2="1041" stroke="#DCE4EF"/><text x="80" y="1069" font-size="17" fill="#61738B">私人 AI 助理 · QQ 单用户 MVP · 设计不等于已实现或实测通过</text><text x="1360" y="1069" text-anchor="end" font-size="17" fill="#61738B">04-technology</text></svg>