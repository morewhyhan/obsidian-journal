<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc"><title id="title">部署架构｜单机运行，数据与代码分离</title><desc id="desc">回答：运行在哪、怎样连接、哪些目录归谁访问。。私人AI助理v2.2目标设计，图中Core内框是逻辑模块，不表示新增微服务。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#172B45"/></marker><marker id="a-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#172B45"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61738B"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#61738B"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A9B8CA"/></marker><marker id="a-line-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#A9B8CA"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#2563EB"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F72"/></marker><marker id="a-green-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#087F72"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C4DCC"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#7C4DCC"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B7791F"/></marker><marker id="a-orange-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#B7791F"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BD4B55"/></marker><marker id="a-red-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#BD4B55"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#748399"/></marker><marker id="a-gray-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#748399"/></marker></defs><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1180" fill="#F8FAFD"/><rect x="80" y="330" width="1280" height="670" rx="22" fill="#EDF4FF" stroke="#2563EB" stroke-opacity=".25"/><rect x="110" y="865" width="785" height="100" rx="22" fill="#F0F3F7" stroke="#748399" stroke-opacity=".25" stroke-dasharray="9 7"/><rect x="80" y="1020" width="1280" height="92" rx="22" fill="#ECF8F3" stroke="#087F72" stroke-opacity=".25"/><polyline points="460,528 545,528" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)" marker-start="url(#a-blue-s)"/><rect x="432" y="428" width="140" height="30" rx="7" fill="#F8FAFD"/><text x="502" y="451" text-anchor="middle" font-size="19" fill="#2563EB">OneBot</text><polyline points="895,528 1000,528" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)" marker-start="url(#a-blue-s)"/><rect x="877" y="428" width="140" height="30" rx="7" fill="#F8FAFD"/><text x="947" y="451" text-anchor="middle" font-size="19" fill="#2563EB">内部 API</text><polyline points="110,222 48,222 48,528 110,528" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)" marker-start="url(#a-blue-s)"/><polyline points="1330,222 1392,222 1392,528 1330,528" fill="none" stroke="#7C4DCC" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-purple)" marker-start="url(#a-purple-s)"/><polyline points="285,600 285,686" fill="none" stroke="#748399" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-gray)"/><polyline points="720,600 720,686" fill="none" stroke="#7C4DCC" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-purple)"/><polyline points="1165,600 1165,686" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><polyline points="895,915 946,915 946,637 1165,637 1165,600" fill="none" stroke="#748399" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-gray)" stroke-dasharray="8 7"/><g data-card="c1"><rect x="110" y="171" width="350" height="102" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 128 172.5 H 442" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c2"><rect x="1000" y="171" width="330" height="102" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1018 172.5 H 1312" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c3"><rect x="110" y="468" width="350" height="132" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 128 469.5 H 442" stroke="#748399" stroke-width="3" stroke-linecap="round"/></g><g data-card="c4"><rect x="545" y="468" width="350" height="132" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 563 469.5 H 877" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c5"><rect x="1000" y="468" width="330" height="132" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1018 469.5 H 1312" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c6"><rect x="110" y="686" width="350" height="130" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 128 687.5 H 442" stroke="#748399" stroke-width="3" stroke-linecap="round"/></g><g data-card="c7"><rect x="545" y="686" width="350" height="130" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 563 687.5 H 877" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c8"><rect x="1000" y="686" width="330" height="130" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 1018 687.5 H 1312" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">部署架构｜单机运行，数据与代码分离</text><text x="80" y="121" font-size="22" fill="#61738B">回答：运行在哪、怎样连接、哪些目录归谁访问。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="132" y="210" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="306">QQ 平台 / 唯一使用者</text><text x="132" y="245" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">日常收发消息</text><text x="1022" y="210" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="286">DeepSeek 服务</text><text x="1022" y="245" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="286">模型请求 / 响应</text><text x="106" y="368" font-size="27" fill="#2563EB" font-weight="700" text-anchor="start" data-fit-width="1228">一台 Linux 服务器｜Docker Compose</text><text x="106" y="400" font-size="20" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1228">Core、AstrBot、NapCat 是独立运行单元；内部 API 与消息桥留在私有网络。</text><text x="132" y="507" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="306">NapCat 容器</text><text x="132" y="542" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">QQ 登录 / OneBot 反向连接</text><text x="132" y="570" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">登录与配置持久化，不挂笔记卷</text><text x="567" y="507" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="306">AstrBot 容器</text><text x="567" y="542" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">项目 Python 插件 / 工具循环</text><text x="567" y="570" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">Core 桥接与发送，不挂笔记卷</text><text x="1022" y="507" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="286">Core 容器</text><text x="1022" y="542" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="286">业务、文件、调度、模型代理</text><text x="1022" y="570" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="286">非 root，只挂必要目录</text><text x="132" y="725" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="306">NapCat 专属卷</text><text x="132" y="760" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">QQ 登录态 / 配置 / 插件</text><text x="132" y="788" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">更新容器保留登录资料</text><text x="567" y="725" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="306">AstrBot 专属卷</text><text x="567" y="760" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">运行配置 / 插件数据</text><text x="567" y="788" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="306">代码插件只读挂载</text><text x="1022" y="725" font-size="23" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="286">Core 专属数据与秘密</text><text x="1022" y="760" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="286">/vault：笔记、事实、运行库</text><text x="1022" y="788" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="286">secret 另在库外，只读挂载</text><text x="136" y="903" font-size="27" fill="#748399" font-weight="700" text-anchor="start" data-fit-width="733">已有 Caddy / Web 兼容入口</text><text x="136" y="935" font-size="20" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="733">仅表示现有兼容路径；QQ 主链不经过它，本轮不扩展 Web。</text><text x="106" y="1055" font-size="24" fill="#087F72" font-weight="700" text-anchor="start" data-fit-width="1220">只有 Core 访问笔记卷；只有授权的维护者管理宿主与登录</text><text x="106" y="1087" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">代码、私人数据、运行库、秘密分开；模型与普通工具不获得宿主目录、Shell 或 Docker socket。</text><line x1="80" x2="1360" y1="1131" y2="1131" stroke="#DCE4EF"/><text x="80" y="1159" font-size="17" fill="#61738B">私人 AI 助理 · QQ 单用户 MVP · 设计不等于已实现或实测通过</text><text x="1360" y="1159" text-anchor="end" font-size="17" fill="#61738B">06-deployment</text></svg>