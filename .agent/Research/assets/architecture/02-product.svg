<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc"><title id="title">产品架构｜一个 QQ 入口，六组能力</title><desc id="desc">回答：用户能做什么，产品边界在哪里。。私人AI助理v2.2目标设计，图中Core内框是逻辑模块，不表示新增微服务。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#172B45"/></marker><marker id="a-ink-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#172B45"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61738B"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#61738B"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A9B8CA"/></marker><marker id="a-line-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#A9B8CA"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#2563EB"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F72"/></marker><marker id="a-green-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#087F72"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7C4DCC"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#7C4DCC"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B7791F"/></marker><marker id="a-orange-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#B7791F"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BD4B55"/></marker><marker id="a-red-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#BD4B55"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#748399"/></marker><marker id="a-gray-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#748399"/></marker></defs><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}*{box-sizing:border-box}</style><rect width="1440" height="1010" fill="#F8FAFD"/><rect x="80" y="164" width="1280" height="96" rx="22" fill="#F4EFFF" stroke="#7C4DCC" stroke-opacity=".25"/><rect x="80" y="752" width="1280" height="92" rx="22" fill="#ECF8F3" stroke="#087F72" stroke-opacity=".25"/><polyline points="280,260 280,330" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/><polyline points="720,260 720,330" fill="none" stroke="#087F72" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><polyline points="1160,260 1160,330" fill="none" stroke="#B7791F" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-orange)"/><g data-card="c1"><rect x="80" y="330" width="400" height="152" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 331.5 H 462" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><g data-card="c2"><rect x="520" y="330" width="400" height="152" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 538 331.5 H 902" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c3"><rect x="960" y="330" width="400" height="152" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 978 331.5 H 1342" stroke="#B7791F" stroke-width="3" stroke-linecap="round"/></g><g data-card="c4"><rect x="80" y="535" width="400" height="152" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 98 536.5 H 462" stroke="#087F72" stroke-width="3" stroke-linecap="round"/></g><g data-card="c5"><rect x="520" y="535" width="400" height="152" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 538 536.5 H 902" stroke="#7C4DCC" stroke-width="3" stroke-linecap="round"/></g><g data-card="c6"><rect x="960" y="535" width="400" height="152" rx="16" fill="#FFFFFF" stroke="#DCE4EF"/><path d="M 978 536.5 H 1342" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">产品架构｜一个 QQ 入口，六组能力</text><text x="80" y="121" font-size="22" fill="#61738B">回答：用户能做什么，产品边界在哪里。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="106" y="202" font-size="27" fill="#7C4DCC" font-weight="700" text-anchor="start" data-fit-width="1228">唯一日常入口：QQ自然对话</text><text x="106" y="234" font-size="20" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1228">不需要学习固定口令；已有笔记通过同一服务器工作副本受控编辑。</text><text x="102" y="369" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">交代与决定</text><text x="102" y="404" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">多项交代 / 草案修订</text><text x="102" y="432" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">整体或部分接受 / 拒绝 / 暂缓</text><text x="102" y="460" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">当前版本和决定可追溯</text><text x="542" y="369" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">任务与习惯</text><text x="542" y="404" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">任务看成果与验收</text><text x="542" y="432" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">习惯看约定最低行为</text><text x="542" y="460" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">开始、进展、完成分别记录</text><text x="982" y="369" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">计划与变化</text><text x="982" y="404" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">次日安排 / 固定事项 / 容量</text><text x="982" y="432" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">依赖、延误、等待与局部重排</text><text x="982" y="460" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">不偷改成果与硬截止</text><text x="102" y="574" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">日记与资料</text><text x="102" y="609" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">年 → 季 → 月 → 周 → 日</text><text x="102" y="637" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">统一模板创建、材料检索</text><text x="102" y="665" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">日记投影只改受管条目</text><text x="542" y="574" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">主动支持</text><text x="542" y="609" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">到期检查 / 资料准备 / 风险</text><text x="542" y="637" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">约定提醒 / 番茄钟 / 小时回顾</text><text x="542" y="665" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">按需开启，不默认全开</text><text x="982" y="574" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="356">偏好与控制</text><text x="982" y="609" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">长期原则 / 临时例外 / 更正</text><text x="982" y="637" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">联系暂停 / 事项暂停</text><text x="982" y="665" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="356">关闭全部主动助理</text><text x="106" y="787" font-size="24" fill="#087F72" font-weight="700" text-anchor="start" data-fit-width="1220">默认低摩擦：说清一次，后面有人接着处理</text><text x="106" y="819" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1220">少追问，不把模板示例当承诺；保护休息与用户选择，不制造补打卡欠账。</text><text x="80" y="908" font-size="24" fill="#172B45" font-weight="700" text-anchor="start">MVP 范围</text><text x="260" y="908" font-size="23" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1070">单用户 QQ · 保留已有 Web 兼容 · 不扩展付费、多租户或任意脚本</text><line x1="80" x2="1360" y1="961" y2="961" stroke="#DCE4EF"/><text x="80" y="989" font-size="17" fill="#61738B">私人 AI 助理 · QQ 单用户 MVP · 设计不等于已实现或实测通过</text><text x="1360" y="989" text-anchor="end" font-size="17" fill="#61738B">02-product</text></svg>