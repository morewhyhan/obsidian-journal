round"/></g><text x="80" y="79" font-size="42" font-weight="750" fill="#172B45">应用架构｜模型理解，Core 核验与执行</text><text x="80" y="121" font-size="22" fill="#61738B">回答：外部系统怎样连接，Core 内部怎样分工。</text><rect x="1210" y="42" width="150" height="42" rx="21" fill="#E8EDF5"/><text x="1285" y="69" text-anchor="middle" font-size="18" fill="#61738B">v2.2 目标设计</text><text x="102" y="205" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="146">你 · QQ</text><text x="102" y="240" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="146">日常交互</text><text x="342" y="205" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="186">NapCat</text><text x="342" y="240" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="186">OneBot 消息桥</text><text x="622" y="205" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="346">AstrBot + 项目插件</text><text x="622" y="240" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="346">对话 / 工具循环 / 回执接续</text><text x="1122" y="205" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="216">DeepSeek Flash</text><text x="1122" y="240" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="216">理解 / 工具选择 / 表达</text><text x="106" y="388" font-size="27" fill="#2563EB" font-weight="700" text-anchor="start" data-fit-width="1228">Core 单体｜应用协调 + 五个业务上下文</text><text x="106" y="420" font-size="20" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="1228">框内均为逻辑职责；没有新增五个服务，也没有第二套任务数据库。</text><text x="132" y="494" font-size="25" fill="#172B45" font-weight="700" text-anchor="start" data-fit-width="841">应用用例与受控工具接口</text><text x="132" y="529" font-size="21" fill="#61738B" font-weight="400" text-anchor="start" data-fit-width="841">当前工作视图 → 执行依据 / 版本检查 → 业务命令与真实回执</text><text x="1072" y="494" font-size="24" fill="#172B45" 